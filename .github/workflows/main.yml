# For more information see:
# https://thegraybook.vvvv.org/reference/extending/publishing.html

name: publish_nuget

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.2.0)'
        required: true
        default: '0.2.0'
      deploy:
        description: 'Really push to nuget.org'
        required: false
        type: boolean

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Git Checkout
        uses: actions/checkout@main

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build src\FiletypeAssoc\FiletypeAssoc.csproj -c Release

      - name: Setup NuGet
        if: ${{ github.event.inputs.deploy == 'true' }}
        uses: nuget/setup-nuget@v2.0.0

      - name: Publish VL NuGet
        if: ${{ github.event.inputs.deploy == 'true' }}
        uses: vvvv/PublishVLNuget@1.0.43
        with:
          nuspec: deployment\VL.FiletypeAssociation.nuspec
          version: ${{ github.event.inputs.version }}
          icon-src: https://raw.githubusercontent.com/vvvv/PublicContent/master/nugeticon.png
          icon-dst: .\deployment\nugeticon.png
          nuget-key: ${{ secrets.NUGET_KEY }}
